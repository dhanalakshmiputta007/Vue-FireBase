<html>

<head>
    <meta charset="UTE-8">
    <meta name="viewport" content="width=device-width, initial-scaler=1.0">
    <title>Learning Vew</title>
    <script src="https://unpkg.com/vue@3.0.2"></script>
    <style>
        .box {
            padding: 100px 0;
            width: 400px;
            text-align: center;
            background-color: #ddd;
            margin: 20px;
            display: inline-block;
        }
        body{
            background: #eee;
            max-width: 960px;
            margin: 20px auto;
        }
        p,h3,ul{
            margin: 0;
            padding: 0;

        }
        li{
            list-style-type: none;
            background: #fff;
            margin: 20px auto;
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        li.fav {
            color: #ddd;
            background: #ff9de2;
        }
        img{
            width:100px;
        }
    </style>
</head>

<body>
    <h1>Hello Vue :)</h1>
    <div id="app">
        <!-- attribute binding -->
         <!-- : (colon) is shorthand for v-bind -->
          <!-- @ (at symbol) is shorthand for v-on -->
         <a v-bind:href="url"> My Portfolio</a>
        <div v-if="showBooks">
            <!-- <p>{{ title }}-{{ author }}-{{ age }}</p> -->
            <!-- <p>{{books[0].title }}-{{ books[0].author }}</p>
            <p>{{ books[1].title }}-{{ books[1].author }}</p> -->
            <!-- <ul>
                <li v-for="book in books" :class="{ fav: book.isFav }" @click="handleFav(book)">
                    <img :src="book.image" :alt="book.title"/>
                    <h1>{{ book.title }}</h1>
                    <p>{{ book.author }}</p>
                </li>
            </ul> -->
            <ul>
                <li v-for="book in filteredBooks" :class="{ fav: book.isFav }" @click="handleFav(book)">
                    <img :src="book.image" :alt="book.title"/>
                    <h1>{{ book.title }}</h1>
                    <p>{{ book.author }}</p>
                </li>
            </ul>
            

        </div>

        <div v-if="showActions"><button v-on:click="age++">Increase Age</button>
            <button v-on:click="age--">Decrease Age</button>
            <button @click="changeTitle('Ramayanam')">change book title</button>
        </div>
        <button @click="toggleShowBook()">
            <span v-if="showBooks">Hide Books</span>
            <!-- <span v-if="!showBooks">Show Books</span> </button> -->
            <span v-else>Show Books</span> </button>
        <div v-show="showBooks"> currently showing books</div>

        <br>
        <!-- mouse events -->
        <div v-if="showEvents"><h1>Mouse Events</h1>
      
        <div class="box" @mouseover="handleEvent('over')">MouseOver (Enter)</div>
        <div class="box" @mouseleave="handleEvent('leave')">Mouse Leave</div>
        <div class="box" @dblclick="handleEvent('dblclick')">Double Click</div>
        <div class="box" @mousemove="handleMouseMove">Position -{{x}} {{y}}</div>
    </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
